name: Tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controleer JavaScript-syntaxis
        run: for file in js/*.js js/core/*.js; do node --experimental-default-type=module --check "$file"; done
      - name: Voer synchronisatietests uit
        run: node --experimental-default-type=module --test tests/*.test.js
